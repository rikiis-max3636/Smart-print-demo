<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Self-Print Counter</title>
    <!-- Loaded Official Stable Firebase SDK Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 440px; background: var(--card-bg); padding: 35px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; text-align: center; }
        .logo-area { font-size: 32px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 700; color: #0f172a; }
        .subtitle { color: var(--text-light); font-size: 14px; margin-bottom: 30px; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 35px 20px; border-radius: 16px; background: #f8fafc; cursor: pointer; transition: all 0.3s ease; margin-bottom: 25px; }
        .upload-area:hover { border-color: var(--primary); background: #eeeffe; }
        .upload-icon { font-size: 28px; color: var(--primary); margin-bottom: 10px; }
        .upload-text { font-size: 14px; font-weight: 500; color: #475569; }
        .upload-sub { font-size: 12px; color: var(--text-light); margin-top: 5px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; text-align: left; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 600; color: #475569; text-transform: uppercase; }
        select, input[type="number"] { padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 500; outline: none; background: #ffffff; width: 100%; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2); transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .status { margin-top: 20px; font-size: 14px; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-area">🖨️</div>
    <h2>Smart Self-Print</h2>
    <p class="subtitle">Upload photo and request print instantly at counter.</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📸</div>
        <span id="infoText" class="upload-text">Tap to Select Photo</span>
        <div class="upload-sub">Only PNG, JPG, or JPEG formats supported</div>
        <input type="file" id="fileInput" style="display:none;" accept="image/png, image/jpeg, image/jpg" onchange="fileSelected()">
    </div>

    <div class="options-grid">
        <div class="control-group">
            <label>Print Type</label>
            <select id="printColor">
                <option value="bw">◼️ Black & White</option>
                <option value="color">🎨 Full Color</option>
            </select>
        </div>
        <div class="control-group">
            <label>No. of Copies</label>
            <input type="number" id="printCopies" min="1" max="100" value="1">
        </div>
    </div>

    <button class="btn" onclick="processAndUpload()">⚡ Request Print Desk</button>
    <div class="status" id="statusMessage"></div>
</div>

<script>
    // 🚨 USER'S PERSONAL FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyCph5BCZMceqb8OWn570zL1xEFbyJ_54RI",
        authDomain: "smart-print-demo.firebaseapp.com",
        projectId: "smart-print-demo",
        storageBucket: "smart-print-demo.firebasestorage.app",
        messagingSenderId: "615366537679",
        appId: "1:615366537679:web:abfc27aed8c110f706a2ba"
    };
    
    // Initialize Firebase Connection
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function fileSelected() {
        const input = document.getElementById('fileInput');
        if(input.files.length > 0) {
            const file = input.files[0];
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            
            if (!validTypes.includes(file.type)) {
                alert("Unable to upload: Wrong format! Please select PNG or JPG only.");
                input.value = "";
                document.getElementById('infoText').innerText = "Tap to Select Photo";
                return;
            }
            document.getElementById('infoText').innerText = "📸 " + file.name;
        }
    }

    function processAndUpload() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('statusMessage');
        const printColor = document.getElementById('printColor').value;
        const printCopies = document.getElementById('printCopies').value;
        
        if (fileInput.files.length === 0) {
            alert("Kripya pehle koi photo select karein!");
            return;
        }

        status.innerText = "⏳ Processing high quality photo...";
        status.style.color = "var(--text-light)";
        
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onloadend = function() {
            const base64Data = reader.result;
            const expiryTime = Date.now() + (5 * 60 * 1000); // 5-Minute expiry calculation

            const requestData = {
                fileName: file.name,
                fileData: base64Data,
                colorMode: printColor,
                copies: parseInt(printCopies, 10) || 1,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                createdAt: Date.now(),
                expiry: expiryTime,
                status: "Pending"
            };

            status.innerText = "🚀 Sending to counter print engine...";

            // Direct route to personal open print path
            database.ref('print_queue').push(requestData)
            .then(() => {
                status.innerText = "🎉 Request Sent! Please pay at the counter.";
                status.style.color = "var(--success)";
                fileInput.value = ""; 
                document.getElementById('infoText').innerText = "Tap to Select Photo";
            })
            .catch((error) => {
                status.innerText = "❌ Network Error! Connection failed.";
                status.style.color = "var(--danger)";
            });
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
