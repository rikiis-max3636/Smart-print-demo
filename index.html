<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Self-Print Counter</title>
    <!-- Loaded Official Stable Firebase SDK Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 440px; background: var(--card-bg); padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; text-align: center; }
        .logo-area { font-size: 32px; margin-bottom: 5px; }
        h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 700; color: #0f172a; }
        .subtitle { color: var(--text-light); font-size: 13px; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 25px 15px; border-radius: 16px; background: #f8fafc; cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); background: #eeeffe; }
        .upload-icon { font-size: 26px; color: var(--primary); margin-bottom: 8px; }
        .upload-text { font-size: 14px; font-weight: 500; color: #475569; word-break: break-all; }
        .upload-sub { font-size: 11px; color: var(--text-light); margin-top: 4px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; text-align: left; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 600; color: #475569; text-transform: uppercase; }
        select, input[type="number"] { padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 500; outline: none; background: #ffffff; width: 100%; box-sizing: border-box; }
        
        .bill-box { background: #f1f5f9; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 15px; font-weight: 600; }
        .bill-amount { color: var(--primary); font-size: 18px; font-weight: 700; }

        .btn-container { display: flex; flex-direction: column; gap: 10px; }
        .btn { border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
        .btn-upi { background: #0284c7; color: white; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2); }
        .btn-upi:hover { background: #0369a1; }
        .btn-counter { background: var(--success); color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2); }
        .btn-counter:hover { background: #059669; }
        .status { margin-top: 15px; font-size: 13px; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-area">🖨️</div>
    <h2>Smart Self-Print</h2>
    <p class="subtitle">Upload document and print instantly.</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📸</div>
        <span id="infoText" class="upload-text">Tap to Select File (PNG/JPG)</span>
        <div class="upload-sub">Supported formats: PNG, JPG</div>
        <input type="file" id="fileInput" style="display:none;" accept="image/png, image/jpeg, image/jpg" onchange="fileSelected()">
    </div>

    <div class="options-grid">
        <div class="control-group">
            <label>Print Type</label>
            <select id="printColor" onchange="calculateTotal()">
                <option value="bw">◼️ Black & White</option>
                <option value="color">🎨 Full Color</option>
            </select>
        </div>
        <div class="control-group">
            <label>No. of Copies</label>
            <input type="number" id="printCopies" min="1" max="100" value="1" oninput="calculateTotal()">
        </div>
    </div>

    <!-- Total Bill Display -->
    <div class="bill-box">
        <span>Total Payable:</span>
        <span class="bill-amount" id="totalBillText">₹3</span>
    </div>

    <div class="btn-container">
        <button class="btn btn-upi" onclick="payViaUpiAutoDetect()">⚡ Pay via UPI & Print</button>
        <button class="btn btn-counter" onclick="processAndUpload('Pay at Counter')">💵 Pay at Counter & Print</button>
    </div>

    <div class="status" id="statusMessage"></div>
</div>

<script>
    // ==========================================
    // 🚨 SHOP CONFIGURATION (Mobile Number Based UPI ID)
    // ==========================================
    const SHOP_CONFIG = {
        upiId: "8874249334@paytm",         // <--- Aapka Mobile Number based UPI Handle
        shopName: "Smart Print Counter",     // <--- Shop ka naam
        pricePerBwCopy: 3,                   // <--- Black & White price per copy (₹3)
        pricePerColorCopy: 5                 // <--- Color price per copy (₹5)
    };

    // Firebase Config (Official credentials)
    const firebaseConfig = {
        apiKey: "AIzaSyCph5BCZMceqb8OWn570zL1xEFbyJ_54RI",
        authDomain: "smart-print-demo.firebaseapp.com",
        databaseURL: "https://smart-print-demo-default-rtdb.firebaseio.com",
        projectId: "smart-print-demo",
        storageBucket: "smart-print-demo.firebasestorage.app",
        messagingSenderId: "615366537679",
        appId: "1:615366537679:web:abfc27aed8c110f706a2ba"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function calculateTotal() {
        const colorMode = document.getElementById('printColor').value;
        const copies = parseInt(document.getElementById('printCopies').value) || 1;
        let rate = (colorMode === 'color') ? SHOP_CONFIG.pricePerColorCopy : SHOP_CONFIG.pricePerBwCopy;
        let total = rate * copies;
        document.getElementById('totalBillText').innerText = "₹" + total;
        return total;
    }

    function fileSelected() {
        const input = document.getElementById('fileInput');
        if(input.files.length > 0) {
            const file = input.files[0];
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!validTypes.includes(file.type)) {
                alert("Wrong format! Please select PNG or JPG image only.");
                input.value = "";
                document.getElementById('infoText').innerText = "Tap to Select File (PNG/JPG)";
                return;
            }
            document.getElementById('infoText').innerText = "📁 " + file.name;
        }
    }

    let isWaitingForPayment = false;

    // Browser Visibility Detector: Jab user payment karke wapas browser me aayega
    document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === 'visible' && isWaitingForPayment) {
            isWaitingForPayment = false;
            
            const pendingFile = localStorage.getItem('pending_print_file');
            if (pendingFile) {
                document.getElementById('statusMessage.innerText').innerText = "🎉 Welcome back! Confirming print order...";
                
                const pendingColor = localStorage.getItem('pending_print_color');
                const pendingCopies = localStorage.getItem('pending_print_copies');
                const pendingAmount = localStorage.getItem('pending_print_amount');

                uploadToFirebaseDirect(pendingFile, pendingColor, pendingCopies, pendingAmount, "Paid via UPI");
                localStorage.removeItem('pending_print_file');
            }
        }
    });

    function payViaUpiAutoDetect() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("Kripya pehle koi photo ya document select karein!");
            return;
        }

        const totalAmount = calculateTotal();
        const printColor = document.getElementById('printColor').value;
        const printCopies = document.getElementById('printCopies').value;
        const file = fileInput.files[0];

        const reader = new FileReader();
        reader.onloadend = function() {
            const base64Data = reader.result;

            // File data ko temporarily browser me save karein
            localStorage.setItem('pending_print_file', base64Data);
            localStorage.setItem('pending_print_color', printColor);
            localStorage.setItem('pending_print_copies', printCopies);
            localStorage.setItem('pending_print_amount', totalAmount);
            isWaitingForPayment = true;

            const orderId = "PRINT_" + Date.now();

            // 100% Clean UPI Intent (Bina block hone wale 'rurl' ke, taaki PhonePe / GPay bina error ke 1klik me chale)
            const upiUrl = `upi://pay?pa=${encodeURIComponent(SHOP_CONFIG.upiId)}&pn=${encodeURIComponent(SHOP_CONFIG.shopName)}&am=${totalAmount}&cu=INR&tr=${orderId}`;
            
            document.getElementById('statusMessage').innerText = "⚡ Opening UPI App... Complete payment there.";
            document.getElementById('statusMessage').style.color = "var(--primary)";

            // Open UPI App smoothly
            window.location.href = upiUrl;
        };
        reader.readAsDataURL(file);
    }

    function processAndUpload(paymentMode) {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("Kripya pehle koi photo ya document select karein!");
            return;
        }
        const printColor = document.getElementById('printColor').value;
        const printCopies = document.getElementById('printCopies').value;
        const totalAmount = calculateTotal();
        const file = fileInput.files[0];

        const reader = new FileReader();
        reader.onloadend = function() {
            uploadToFirebaseDirect(reader.result, printColor, printCopies, totalAmount, paymentMode);
        };
        reader.readAsDataURL(file);
    }

    function uploadToFirebaseDirect(base64Data, printColor, printCopies, totalAmount, paymentMode) {
        const status = document.getElementById('statusMessage');
        status.innerText = "⏳ Sending print request to counter...";
        status.style.color = "var(--text-light)";

        const expiryTime = Date.now() + (10 * 60 * 1000); // 10-Minute expiry

        const requestData = {
            fileName: "Print_Document.jpg",
            fileData: base64Data,
            colorMode: printColor,
            copies: printCopies,
            totalAmount: totalAmount,
            paymentStatus: paymentMode,
            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            expiry: expiryTime,
            status: "Pending"
        };

        database.ref('print_queue').push(requestData)
        .then(() => {
            status.innerText = paymentMode === 'Paid via UPI' ? "🎉 Payment Completed & Print Sent Successfully!" : "🎉 Request Sent! Please pay at counter.";
            status.style.color = "var(--success)";
            document.getElementById('fileInput').value = ""; 
            document.getElementById('infoText').innerText = "Tap to Select File (PNG/JPG)";
            calculateTotal();
        })
        .catch((error) => {
            status.innerText = "❌ Network Error! Connection failed.";
            status.style.color = "var(--danger)";
        });
    }

    window.onload = calculateTotal;
</script>
</body>
</html>
